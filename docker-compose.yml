services:
  app:
    build: .
    container_name: go-bank-api
    ports:
      - "8097:8097"
    volumes:
      - ./.env.docker:/root/.env
    environment:
      - SERVER_HOST=0.0.0.0
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_GRPC_HOST=qdrant
    depends_on:
      - qdrant
    restart: unless-stopped
    networks:
      - bank-network

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant-db
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped
    networks:
      - bank-network

volumes:
  qdrant_data:

networks:
  bank-network:
    driver: bridge
